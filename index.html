<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aarohi AI</title><link rel="stylesheet" href="/static/style.css"></head>
<body><header><div class="brand">✦ Aarohi <span>AI</span></div><nav><button onclick="showAuth()">Login / Signup</button></nav></header>
<main><aside><h2>आपकी AI दुनिया</h2><div id="characters"></div><button class="new" onclick="newCharacter()">＋ Create Character</button><button class="coach" onclick="openCoach()">AI Coach</button><p class="muted">आपकी बातचीत निजी रखने के लिए अपना अकाउंट बनाएं।</p></aside>
<section class="chat"><div class="welcome" id="welcome"><div class="orb">✦</div><h1>Meet Aarohi AI</h1><p>बात करें, अपना AI character बनाएं और नए विचार खोजें।</p><button onclick="showAuth()">शुरू करें</button></div><div id="room" hidden><div class="chathead"><div><b id="charName">Aarohi</b><small id="charDesc"></small></div><span>● Online</span></div><div id="messages"></div><form id="send"><input id="message" placeholder="Aarohi से कुछ भी पूछें..." autocomplete="off"><button>➤</button></form></div></section></main>
<div class="modal" id="auth"><div class="dialog"><button class="x" onclick="hide('auth')">✕</button><h2>Welcome to Aarohi AI</h2><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password (8+ characters)"><div class="actions"><button onclick="authAction('login')">Login</button><button onclick="authAction('register')">Create account</button></div><p id="authMsg"></p></div></div>
<div class="modal" id="create"><div class="dialog"><button class="x" onclick="hide('create')">✕</button><h2>Create your character</h2><input id="cname" placeholder="Character name"><textarea id="personality" placeholder="Personality (e.g. funny, kind, thoughtful)"></textarea><input id="greeting" placeholder="First greeting"><button onclick="saveCharacter()">Create</button><p id="createMsg"></p></div></div>
<div class="modal" id="coach"><div class="dialog"><button class="x" onclick="hide('coach')">✕</button><h2>AI Coach</h2><textarea id="coachText" placeholder="अपना मैसेज यहाँ डालें..."></textarea><button onclick="runCoach()">Analyze & Suggest</button><p id="coachResult"></p></div></div>
<script src="/static/app.js"></script></body></html>
