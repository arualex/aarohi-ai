<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Aarohi AI — Interactive Stories</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: #09090f; color: #f5f5fa; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }

    /* Top Bar */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: rgba(15, 15, 24, 0.9);
      border-bottom: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(12px);
      z-index: 10;
    }
    .brand { font-size: 20px; font-weight: 800; letter-spacing: 0.3px; }
    .brand span { background: linear-gradient(90deg, #ff4b7d, #ffb347); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-actions { display: flex; align-items: center; gap: 8px; }
    .pill-btn {
      background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.12);
      padding: 7px 12px; border-radius: 20px; font-size: 12.5px; font-weight: 600; cursor: pointer; text-decoration: none;
    }
    .pill-btn.primary { background: linear-gradient(135deg, #ff416c, #ff4b2b); border: none; }

    /* Home Screen (Saga Poster Grid) */
    #home-view { flex: 1; overflow-y: auto; padding: 16px; max-width: 680px; width: 100%; margin: 0 auto; }
    .hero-banner {
      background: linear-gradient(135deg, #2a1138, #141226);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 18px;
      padding: 18px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .hero-banner h1 { font-size: 19px; margin-bottom: 4px; }
    .hero-banner p { font-size: 12.5px; color: #b5b5cc; }

    .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .section-head h2 { font-size: 15px; color: #d8d8ec; }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding-bottom: 24px; }
    .char-card {
      position: relative; height: 235px; border-radius: 18px; overflow: hidden;
      cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end;
      padding: 14px; border: 1px solid rgba(255,255,255,0.12); transition: transform 0.15s;
    }
    .char-card:active { transform: scale(0.97); }
    .char-card::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(6,6,12,0.95) 12%, rgba(6,6,12,0.25) 60%, transparent 100%);
      z-index: 1;
    }
    .char-bg-emoji {
      position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
      font-size: 64px; opacity: 0.9; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5)); z-index: 0;
    }
    .char-info { position: relative; z-index: 2; }
    .char-badge {
      display: inline-block; font-size: 10px; font-weight: 700; padding: 3px 8px;
      border-radius: 12px; background: rgba(255,255,255,0.18); backdrop-filter: blur(6px); margin-bottom: 6px;
    }
    .char-info h3 { font-size: 17px; margin-bottom: 3px; }
    .char-info p {
      font-size: 11.5px; color: #d0d0e2; line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* Full-Screen Cinematic Chat View */
    #chat-view {
      display: none; flex-direction: column; height: 100dvh; max-width: 680px; width: 100%;
      margin: 0 auto; position: relative; background-size: cover; background-position: center;
    }
    #chat-view::before {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(10,10,18,0.82) 0%, rgba(10,10,18,0.55) 45%, rgba(8,8,14,0.94) 100%);
      z-index: 0;
    }
    .chat-header, .messages, .quick-replies, .chat-input { position: relative; z-index: 2; }

    .chat-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; background: rgba(15,15,25,0.65); backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .chat-left { display: flex; align-items: center; gap: 10px; }
    .back-btn {
      background: rgba(255,255,255,0.12); border: none; color: #fff; width: 34px; height: 34px;
      border-radius: 50%; font-size: 16px; cursor: pointer;
    }
    .chat-title b { font-size: 16px; display: block; }
    .chat-title small { font-size: 11px; color: #7ef29d; }

    .messages { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 12px; }
    .msg {
      max-width: 84%; padding: 11px 14px; border-radius: 18px; font-size: 14.5px; line-height: 1.5;
      backdrop-filter: blur(10px); word-wrap: break-word;
    }
    .msg.assistant {
      align-self: flex-start; background: rgba(26, 26, 42, 0.78);
      border: 1px solid rgba(255,255,255,0.1); border-bottom-left-radius: 4px;
    }
    .msg.user {
      align-self: flex-end; background: linear-gradient(135deg, #ff416c, #ff4b2b);
      border-bottom-right-radius: 4px; color: #fff;
    }
    .msg em { color: #ffd180; font-style: italic; }

    .quick-replies {
      display: flex; gap: 8px; overflow-x: auto; padding: 6px 14px 10px; scrollbar-width: none;
    }
    .quick-replies::-webkit-scrollbar { display: none; }
    .chip {
      white-space: nowrap; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.16);
      color: #f0f0ff; padding: 7px 12px; border-radius: 18px; font-size: 12px; cursor: pointer; backdrop-filter: blur(8px);
    }

    .chat-input {
      display: flex; gap: 8px; padding: 10px 12px 14px;
      background: rgba(12,12,20,0.88); border-top: 1px solid rgba(255,255,255,0.08);
    }
    .chat-input input {
      flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
      border-radius: 24px; padding: 11px 16px; color: #fff; font-size: 14px; outline: none;
    }
    .chat-input button {
      background: linear-gradient(135deg, #ff416c, #ff4b2b); border: none; color: #fff;
      width: 44px; height: 44px; border-radius: 50%; font-size: 16px; cursor: pointer;
    }

    /* Modals */
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px); z-index: 50; align-items: center; justify-content: center; padding: 16px;
    }
    .modal.open { display: flex; }
    .dialog {
      background: #161624; border: 1px solid rgba(255,255,255,0.12); border-radius: 20px;
      padding: 22px; width: 100%; max-width: 390px; position: relative;
    }
    .dialog h2 { font-size: 18px; margin-bottom: 14px; }
    .dialog input, .dialog textarea {
      width: 100%; background: #0d0d16; border: 1px solid #2c2c44; color: #fff;
      padding: 11px 13px; border-radius: 10px; margin-bottom: 10px; font-size: 14px; outline: none;
    }
    .dialog textarea { min-height: 85px; resize: vertical; }
    .dialog .btn-row { display: flex; gap: 8px; margin-top: 4px; }
    .dialog button.submit {
      flex: 1; background: linear-gradient(135deg, #ff416c, #ff4b2b); color: #fff;
      border: none; padding: 11px; border-radius: 10px; font-weight: 700; cursor: pointer;
    }
    .dialog button.sec { background: #26263a; }
    .close-x {
      position: absolute; top: 14px; right: 14px; background: none; border: none;
      color: #aaa; font-size: 18px; cursor: pointer;
    }
    .status-msg { font-size: 12.5px; color: #ffb347; margin-top: 10px; line-height: 1.4; }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="topbar" id="main-topbar">
    <div class="brand">✦ Aarohi <span>AI</span></div>
    <div class="nav-actions" id="nav-actions">
      <button class="pill-btn primary" onclick="openModal('auth')">Login / Signup</button>
    </div>
  </header>

  <!-- Home View -->
  <main id="home-view">
    <div class="hero-banner">
      <div>
        <h1>अपनी कहानी चुनें ✨</h1>
        <p>पसंदीदा कैरेक्टर के साथ इंटरैक्टिव चैट शुरू करें</p>
      </div>
      <button class="pill-btn" onclick="openModal('coach')">🧠 AI Coach</button>
    </div>

    <div class="section-head">
      <h2>पॉपुलर कैरेक्टर्स</h2>
      <button class="pill-btn" onclick="openModal('create')">＋ नया बनाएं</button>
    </div>

    <div class="grid" id="char-grid"></div>
  </main>

  <!-- Full-Screen Chat View -->
  <section id="chat-view">
    <div class="chat-header">
      <div class="chat-left">
        <button class="back-btn" onclick="closeChat()">←</button>
        <div class="chat-title">
          <b id="chat-name">Aarohi</b>
          <small>● Live Scene</small>
        </div>
      </div>
      <a href="/wallet" class="pill-btn" id="chat-credits">💎 --</a>
    </div>

    <div class="messages" id="messages"></div>

    <div class="quick-replies">
      <button class="chip" onclick="quickSend('*मुस्कुराते हुए* आज क्या खास है?')">😊 आज क्या खास है?</button>
      <button class="chip" onclick="quickSend('चलो कहीं घूमने चलते हैं')">🌙 घूमने चलें?</button>
      <button class="chip" onclick="quickSend('मुझे एक राज़ बताओ')">🤫 एक राज़ बताओ</button>
    </div>

    <form class="chat-input" onsubmit="sendMessage(event)">
      <input id="msg-input" placeholder
